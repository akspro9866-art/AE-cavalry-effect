name: CI

# The headless `test` job runs unconditionally on EVERY push and pull request:
# the trigger block deliberately carries no branch or path filters so a push to
# any branch can never produce a zero-job run. All matrix legs execute strictly
# against the deterministic mock (Tier 1-3 + Tier 5 math suites) — no leg ever
# contacts port 8080, so hosted runners can neither hang nor fail on
# connection refused. Anything needing a live Cavalry 2.8.0 bridge lives in
# the workflow_dispatch-only live-verify job, additionally gated on the
# explicit CAVALRY_LIVE=true environment check honoured by
# scripts/live-verify-all-effects.mjs (process.env.CAVALRY_LIVE === 'true').

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # Opt-in gate for live-Cavalry work, sourced from a repository variable so
  # forks stay headless by default. live-verify re-asserts it explicitly.
  CAVALRY_LIVE: ${{ vars.CAVALRY_LIVE || 'false' }}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Validate embedded source synchronization
        run: node scripts/sync-embedded.mjs --check

      - name: Validate AI-agent configuration synchronization
        run: node scripts/sync-agent-configs.mjs --check

      - name: Validate generated Cavalry script synchronization
        run: node scripts/sync-cavalry-script.mjs --check

      - name: Run automated test suite (Tiers 1, 2, 3 & 5)
        run: npm test

  # Manual-only live verification against a real Cavalry 2.8.0 bridge on port
  # 8080. Runs exclusively on workflow_dispatch and only when CAVALRY_LIVE is
  # 'true'; the live script independently re-checks the env gate and skips
  # deterministically otherwise.
  live-verify:
    if: github.event_name == 'workflow_dispatch' && env.CAVALRY_LIVE == 'true'
    runs-on: ubuntu-latest
    env:
      CAVALRY_LIVE: 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Live verification (requires a reachable Cavalry bridge)
        run: npm run test:live
